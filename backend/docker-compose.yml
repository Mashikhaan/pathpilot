services:
  redis:
    image: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - ./services/auth/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy

  resume:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    env_file:
      - ./services/resume/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "8002"
    depends_on:
      redis:
        condition: service_healthy

  interview:
    build:
      context: .
      dockerfile: services/interview/Dockerfile
    env_file:
      - ./services/interview/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "8003"
    depends_on:
      redis:
        condition: service_healthy

  roadmap:
    build:
      context: .
      dockerfile: services/roadmap/Dockerfile
    env_file:
      - ./services/roadmap/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "8004"
    depends_on:
      redis:
        condition: service_healthy

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile      
    env_file:
      - ./services/billing/.env
    environment:
      AUTH_SERVICE_URL: http://auth:8001
    expose:
      - "8005" 
    depends_on:
      - auth   

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile    
    env_file:
      - ./gateway/.env
    environment:
      FRONTEND_URL: http://localhost:5173
      AUTH_SERVICE_URL: http://auth:8001
      RESUME_SERVICE_URL: http://resume:8002
      INTERVIEW_SERVICE_URL: http://interview:8003
      ROADMAP_SERVICE_URL: http://roadmap:8004
      BILLING_SERVICE_URL: http://billing:8005
    ports:
      - "8000:8000"
    depends_on:
     - auth    
     - resume    
     - interview    
     - roadmap   
     - billing
     - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - ../frontend/.env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"     
    ports:
      - "5173:5173"   
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - gateway

volumes:
  frontend_node_modules:          
          
